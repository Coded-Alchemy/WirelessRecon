
; ============================================================
; WirelessRecon - Main PlatformIO Configuration
; ============================================================
;
; PURPOSE
; This is the project's primary PlatformIO entry point.
;
; RESPONSIBILITIES
;   - Define the default build environment.
;   - Define project source and include directories.
;   - Define shared platform, framework, library, and compiler settings.
;   - Import the board, test, and diagnostic configuration files.
;
; EXPECTED CONFIGURATION FILES
;   config/platformio.boards.ini
;       Board-specific firmware environments.
;
;   config/platformio.tests.ini
;       Native host-side unit test environments.
;
;   config/platformio.diagnostics.ini
;       Hardware diagnostic and diagnostic firmware environments.
;
; ORGANIZATION RULES
;   - Keep shared settings in this file.
;   - Do not put board-specific pin mappings or build flags here.
;   - Do not put individual test filters here.
;   - Do not define board or diagnostic environments here.
;   - Add future configuration files to extra_configs below.
;
; All imported files are part of this one PlatformIO project.
; They are not independent PlatformIO projects.

[platformio]
default_envs = thingpulse_wrover
src_dir = src
include_dir = include

extra_configs =
    config/platformio.boards.ini
    config/platformio.tests.ini
    config/platformio.diagnostics.ini

; ------------------------------------------------------------
; Shared settings inherited by firmware environments.
; ------------------------------------------------------------

[env]
platform = espressif32@6.6.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    lvgl/lvgl@^9.2.2

build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE

[platformio]
default_envs = thingpulse_wrover
src_dir = src
include_dir = include

[env]
platform = espressif32@6.6.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    lvgl/lvgl@^9.2.2
build_flags =
    -I include

[env:thingpulse_wrover]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_build.psram = enabled
build_flags =
    ${env.build_flags}
    -D WR_BOARD_THINGPULSE_WROVER
    -D BOARD_HAS_PSRAM
build_src_filter =
    +<legacy/WirelessRecon_Phase7_1_Baseline.cpp>
    +<core/DeviceInventory.cpp>
    -<main.cpp>
    -<targets/>

[env:esp32_s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -D WR_BOARD_ESP32_S3
build_src_filter =
    +<targets/board_scaffold.cpp>
    +<core/DeviceInventory.cpp>
    -<legacy/>
    -<main.cpp>

[env:esp32_c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D WR_BOARD_ESP32_C3
build_src_filter =
    +<targets/board_scaffold.cpp>
    +<core/DeviceInventory.cpp>
    -<legacy/>
    -<main.cpp>

[env:esp32_32e_28lcd]
; Photo-identified module: ESP32-32E N4 (4 MB flash), original ESP32 family.
; The display is marked 2.8-inch, 240x320, resistive touch.
; Panel/touch controller and GPIO mapping are not confirmed yet.
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -D WR_BOARD_ESP32_32E
build_src_filter =
    +<targets/board_scaffold.cpp>
    +<core/DeviceInventory.cpp>
    -<legacy/>
    -<main.cpp>
    
; ============================================================
; ELEGOO ESP32-32E 2.8" LCD - Hardware Diagnostic
; ============================================================

[env:esp32_32e_28lcd_test]
board = esp32dev

board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    paulstoffregen/XPT2046_Touchscreen

build_flags =
    -I include
    -D WR_BOARD_ESP32_32E
    -D WR_HARDWARE_DIAGNOSTIC

build_src_filter =
    -<*>
    +<hardware_test/>

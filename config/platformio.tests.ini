
; ============================================================
; WirelessRecon - Native Test Environments
; ============================================================
;
; PURPOSE
; Define host-side tests that run on the development computer
; without requiring an ESP32 board.
;
; CONTAINS
;   - Unity test framework configuration.
;   - Native compiler settings.
;   - Test filters.
;   - Source files required by native tests.
;
; RULES
;   - Add portable unit test suites to test_filter.
;   - Add required production source files to build_src_filter.
;   - Keep ESP32 hardware-only dependencies out of native tests.
;   - Use test/mocks for hardware APIs that need host-side substitutes.
;   - Do not put firmware board environments in this file.

; ------------------------------------------------------------
; Native host-side unit tests
; ------------------------------------------------------------

[env:native_tests]
platform = native
framework =
test_framework = unity

test_filter =
    test_device_inventory
    test_observation_queue
    test_wireless_coordinator
    test_device_model
    test_inventory_edge_cases
    test_wifi_scanner
    test_ble_scanner
    test_responsive_layout

test_build_src = yes

lib_deps =

build_flags =
    -std=c++17
    -I test/mocks
    -I include

build_src_filter =
    -<*>
    +<core/DeviceInventory.cpp>
    +<core/ObservationQueue.cpp>
    +<core/WirelessCoordinator.cpp>
    +<hardware/radio/WifiScanner.cpp>
    +<hardware/radio/BleScanner.cpp>

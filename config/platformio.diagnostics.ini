
; ============================================================
; WirelessRecon - Hardware Diagnostic Environments
; ============================================================
;
; PURPOSE
; Define environments used to validate physical hardware and
; run diagnostic firmware builds.
;
; CONTAINS
;   - ELEGOO ESP32-32E 2.8-inch LCD hardware diagnostic.
;   - ThingPulse modular firmware with hardware diagnostics enabled.
;
; RULES
;   - Put hardware-test-only libraries and source filters here.
;   - Keep board firmware environments in platformio.boards.ini.
;   - Keep native host-side tests in platformio.tests.ini.
;   - Diagnostic environments may extend a board environment.
;   - Keep diagnostic-only compiler definitions isolated here.

; ------------------------------------------------------------
; ELEGOO ESP32-32E - 2.8-inch LCD hardware diagnostic
; ------------------------------------------------------------

[env:esp32_32e_28lcd_test]
board = esp32dev

board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    paulstoffregen/XPT2046_Touchscreen

build_flags =
    -I include
    -D WR_BOARD_ESP32_32E
    -D WR_HARDWARE_DIAGNOSTIC

build_src_filter =
    -<*>
    +<hardware_test/>

; ------------------------------------------------------------
; ThingPulse ESP32-WROVER - Modular hardware diagnostics
; ------------------------------------------------------------

[env:thingpulse_wrover_modular_diag]
extends = env:thingpulse_wrover_modular

build_flags =
    ${env:thingpulse_wrover_modular.build_flags}
    -D WR_ENABLE_HARDWARE_DIAGNOSTICS

; ============================================================
; WirelessRecon - Board Firmware Environments
; ============================================================
;
; PURPOSE
; Define firmware build environments for supported ESP32 boards.
;
; RULES
;   - Put board-specific build flags and source filters here.
;   - Put board-specific CPU, flash, PSRAM, and partition settings here.
;   - Keep shared platform and library dependencies in the root file.
;   - Put hardware diagnostic environments in platformio.diagnostics.ini.
;   - Put native host tests in platformio.tests.ini.

; ------------------------------------------------------------
; ThingPulse ESP32-WROVER - Legacy Phase 7.1 baseline
; ------------------------------------------------------------

[env:thingpulse_wrover]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_build.psram = enabled

build_flags =
    ${env.build_flags}
    -D WR_BOARD_THINGPULSE_WROVER
    -D BOARD_HAS_PSRAM

build_src_filter =
    +<legacy/WirelessRecon_Phase7_1_Baseline.cpp>
    +<core/DeviceInventory.cpp>
    -<main.cpp>
    -<targets/>

; ------------------------------------------------------------
; ESP32-S3
; ------------------------------------------------------------

[env:esp32_s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = huge_app.csv

build_flags =
    ${env.build_flags}
    -D WR_BOARD_ESP32_S3

build_src_filter =
    +<targets/board_scaffold.cpp>
    +<core/DeviceInventory.cpp>
    +<core/ObservationQueue.cpp>
    +<core/WirelessCoordinator.cpp>
    +<core/CoreMemoryServices.cpp>
    +<hardware/display/DisplayManager.cpp>
    -<legacy/>
    -<main.cpp>

; ------------------------------------------------------------
; ESP32-C3
; ------------------------------------------------------------

[env:esp32_c3]
board = esp32-c3-devkitm-1

build_flags =
    ${env.build_flags}
    -D WR_BOARD_ESP32_C3

build_src_filter =
    +<targets/board_scaffold.cpp>
    +<core/DeviceInventory.cpp>
    +<core/ObservationQueue.cpp>
    +<core/WirelessCoordinator.cpp>
    +<core/CoreMemoryServices.cpp>
    +<hardware/display/DisplayManager.cpp>
    -<legacy/>
    -<main.cpp>

; ------------------------------------------------------------
; ELEGOO ESP32-32E N4 - 2.8-inch 240x320 display
; ------------------------------------------------------------
;
; Original ESP32 family, 4 MB flash.
; Display is marked ILI9341 240x320 with resistive touch.
; Exact panel/touch GPIO mapping remains subject to validation.

[env:esp32_32e_28lcd]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

build_flags =
    ${env.build_flags}
    -D WR_BOARD_ESP32_32E

build_src_filter =
    +<targets/board_scaffold.cpp>
    +<core/DeviceInventory.cpp>
    +<core/ObservationQueue.cpp>
    +<core/WirelessCoordinator.cpp>
    +<core/CoreMemoryServices.cpp>
    +<hardware/display/DisplayManager.cpp>
    -<legacy/>
    -<main.cpp>

; ------------------------------------------------------------
; ThingPulse ESP32-WROVER - Modular firmware
; ------------------------------------------------------------

[env:thingpulse_wrover_modular]
board = esp32dev

board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_build.psram = enabled

build_flags =
    ${env.build_flags}
    -D WR_BOARD_THINGPULSE_WROVER
    -D BOARD_HAS_PSRAM
    -D WR_MODULAR_BUILD

build_src_filter =
    -<*>
    +<application/ApplicationRuntime.cpp>
    +<core/DeviceInventory.cpp>
    +<core/ObservationQueue.cpp>
    +<core/WirelessCoordinator.cpp>
    +<core/CoreMemoryServices.cpp>
    +<diagnostics/*.cpp>
    +<hardware/display/DisplayManager.cpp>
    +<hardware/display/drivers/LovyanGFXDisplay.cpp>
    +<hardware/display/DisplayConfigFactory.cpp>
    +<hardware/radio/BleScanner.cpp>
    +<hardware/radio/RadioController.cpp>
    +<hardware/radio/WifiScanner.cpp>
    +<hardware/touch/TouchManager.cpp>
    +<hardware/touch/TouchConfigFactory.cpp>
    +<hardware/touch/drivers/FT6236Touch.cpp>
    +<targets/board_scaffold.cpp>
    +<ui/lvgl/LVGLManager.cpp>
    +<ui/screens/DashboardScreen.cpp>
    +<ui/screens/WifiScreen.cpp>